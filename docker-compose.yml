services:
  mongo:
    image: mongo:7
    ports:
      - '27019:27017'
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      target: base
    command: npx tsx server/index.ts
    environment:
      MONGODB_URI: mongodb://mongo:27017/plan-to-linear
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
    depends_on:
      - mongo

  web:
    build:
      context: .
      target: web
    command: npx vite preview --host --port 5173
    environment:
      API_ORIGIN: http://api:3001
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  mongo-data:
